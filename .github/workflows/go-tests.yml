name: Go enterprise-api tests
# Author: Ciprian Ștefan Pleșca

on:
  push:
    paths:
      - "enterprise-api/**"
      - ".github/workflows/go-tests.yml"
  pull_request:
    paths:
      - "enterprise-api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -v
