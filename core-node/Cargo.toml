[package]
name = "zk-threat-core-node"
version = "0.1.0"
edition = "2021"
authors = ["Ciprian Ștefan Pleșca"]
description = "P2P gossip node with zero-knowledge threat-indicator proofs"
license = "MIT"

[[bin]]
name = "zk-node"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
